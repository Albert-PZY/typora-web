<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="title description">
  <title id="title">Typora-Web editor architecture</title>
  <desc id="description">A source-preserving Markdown document flowing through ProseMirror into an in-place rendered web editor.</desc>
  <defs>
    <linearGradient id="canvas" x1="40" y1="8" x2="920" y2="272" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827" />
      <stop offset="0.52" stop-color="#1c2431" />
      <stop offset="1" stop-color="#10151d" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e4b45f" />
      <stop offset="1" stop-color="#a97525" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="960" height="280" rx="24" fill="url(#canvas)" />
  <circle cx="886" cy="38" r="118" fill="#d49a3a" opacity="0.07" />
  <circle cx="86" cy="270" r="132" fill="#6b8cae" opacity="0.06" />

  <g transform="translate(46 32)" filter="url(#shadow)">
    <rect width="492" height="216" rx="14" fill="#fffdf8" />
    <rect width="492" height="34" rx="14" fill="#f0ece4" />
    <path d="M0 34h492" stroke="#dfd8cc" />
    <circle cx="18" cy="17" r="4" fill="#c98e8a" />
    <circle cx="32" cy="17" r="4" fill="#d7b66c" />
    <circle cx="46" cy="17" r="4" fill="#7ba084" />

    <g transform="translate(28 58)">
      <rect width="116" height="134" rx="8" fill="#f5f1e9" />
      <text x="15" y="25" fill="#8a8176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">OUTLINE</text>
      <rect x="15" y="42" width="72" height="6" rx="3" fill="#c8bfb2" />
      <rect x="25" y="60" width="62" height="6" rx="3" fill="#ded6cb" />
      <rect x="25" y="78" width="74" height="6" rx="3" fill="#ded6cb" />
      <rect x="15" y="101" width="82" height="7" rx="3.5" fill="url(#accent)" opacity="0.85" />
    </g>

    <g transform="translate(172 58)">
      <text x="0" y="25" fill="#22252a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700">Write naturally.</text>
      <text x="0" y="50" fill="#5e6269" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Markdown stays editable and round-trippable.</text>
      <rect x="0" y="72" width="266" height="50" rx="7" fill="#f7f3ea" />
      <rect x="14" y="86" width="12" height="6" rx="3" fill="#b9852e" />
      <rect x="32" y="86" width="150" height="6" rx="3" fill="#777d85" />
      <rect x="14" y="103" width="212" height="6" rx="3" fill="#c3bbb0" />
      <rect x="0" y="140" width="64" height="22" rx="11" fill="#28313c" />
      <text x="32" y="155" text-anchor="middle" fill="#f7f3ea" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10">KaTeX</text>
      <rect x="72" y="140" width="74" height="22" rx="11" fill="#28313c" />
      <text x="109" y="155" text-anchor="middle" fill="#f7f3ea" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10">Mermaid</text>
      <rect x="154" y="140" width="96" height="22" rx="11" fill="#28313c" />
      <text x="202" y="155" text-anchor="middle" fill="#f7f3ea" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10">CodeMirror 6</text>
    </g>
  </g>

  <g transform="translate(580 50)">
    <text x="0" y="12" fill="#f6f1e8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="700">Typora-Web</text>
    <text x="0" y="39" fill="#aeb7c4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">Native DOM. ProseMirror state.</text>
    <text x="0" y="60" fill="#aeb7c4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">Lossless Markdown boundaries.</text>

    <g transform="translate(0 91)">
      <rect width="105" height="42" rx="9" fill="#273342" stroke="#46566a" />
      <text x="52.5" y="26" text-anchor="middle" fill="#f4ead9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">Markdown</text>
      <path d="M113 21h28" stroke="#b9852e" stroke-width="2" />
      <path d="m136 16 6 5-6 5" fill="none" stroke="#b9852e" stroke-width="2" />
      <rect x="150" width="118" height="42" rx="9" fill="#273342" stroke="#46566a" />
      <text x="209" y="26" text-anchor="middle" fill="#f4ead9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">EditorState</text>
      <path d="M276 21h28" stroke="#b9852e" stroke-width="2" />
      <path d="m299 16 6 5-6 5" fill="none" stroke="#b9852e" stroke-width="2" />
      <rect x="313" width="64" height="42" rx="9" fill="url(#accent)" />
      <text x="345" y="26" text-anchor="middle" fill="#171b22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">View</text>
    </g>

    <g transform="translate(0 156)" fill="#7f8b9a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
      <text x="0" y="0">framework-free</text>
      <text x="116" y="0">spec-driven</text>
      <text x="218" y="0">browser-native</text>
    </g>
  </g>
</svg>
